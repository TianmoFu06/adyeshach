name: Java CI with Gradle for branch 2.1

# 控制工作流的触发时机
on:
  push:
    branches: [ "2.1" ] # 仅在推送到 2.1 分支时触发
  pull_request:
    branches: [ "2.1" ] # 仅在向 2.1 分支发起拉取请求时触发

# 定义一个或多个作业
jobs:
  build:
    # 指定作业运行的虚拟环境
    runs-on: ubuntu-latest

    # 作业的步骤序列
    steps:
      # 步骤1：检出您的代码库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤2：设置Java环境
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # 使用 Eclipse Temurin 发行版. [1, 9]

      # 步骤3：为gradlew脚本授予执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 步骤4：缓存Gradle依赖项
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 步骤5：使用Gradle构建项目
      - name: Build with Gradle
        run: ./gradlew clean build

