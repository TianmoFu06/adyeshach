name: Java CI with Gradle for branch 2.1

on:
  push:
    branches: [ "2.1" ]
  pull_request:
    branches: [ "2.1" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # 使用 Eclipse Temurin 发行版. [1, 9]

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew clean build

      # 新增步骤：上传构建产物
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-application-jar # 您可以自定义上传产物的名称
          path: build/libs/*.jar  # 指定要上传的文件的路径，*.jar会匹配所有.jar文件

